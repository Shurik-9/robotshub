server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Preserve full paths, and never serve SPA HTML for news XML or articles.
    # The standalone news engine has its own persistent SQLite volume.
    location ~ ^/(news(?:/|$)|api/(?:news|cabinet|leads)(?:/|$)|admin-news(?:/|$)|cabinet(?:/|$)|lead(?:/|$)) {
        proxy_pass http://news:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Перепроверять HTML после деплоя, чтобы браузер не использовал старые хэши ассетов.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SEO_ROUTE_LOCATIONS

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}